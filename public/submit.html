<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Submitted — The Web Tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #151515;
    --ink-soft: #6b6b6b;
    --line: #ececec;
    --grad: linear-gradient(135deg, #FF5924, #FF7DD3);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    height: 100%;
  }

  body{
    font-family: 'Space Grotesk', Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 18% 8%, rgba(255,89,36,0.08), transparent 45%),
      radial-gradient(circle at 85% 92%, rgba(255,125,211,0.10), transparent 50%),
      #fafafa;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card{
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 56px 48px 48px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(21,21,21,0.07);
    opacity: 0;
    transform: translateY(14px) scale(0.97);
    animation: rise 0.6s cubic-bezier(.2,.8,.2,1) forwards;
  }

  .icon-ring{
    width: 76px;
    height: 76px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: var(--grad);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-ring svg{
    width: 34px;
    height: 34px;
  }

  .check-path{
    stroke-dasharray: 28;
    stroke-dashoffset: 28;
    animation: draw 0.5s ease 0.35s forwards;
  }

  h1{
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 12px;
  }

  p.lead{
    font-size: 15.5px;
    line-height: 1.6;
    color: var(--ink-soft);
    margin-bottom: 32px;
  }

  a.go-back{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    background: var(--grad);
    color: #fff;
    font-weight: 600;
    font-size: 14.5px;
    padding: 13px 26px;
    border-radius: 50px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 8px 20px rgba(255,89,36,0.25);
  }

  a.go-back:hover{
    transform: translateY(-2px);
    box-shadow: 0 12px 26px rgba(255,89,36,0.32);
  }

  a.go-back svg{
    width: 16px;
    height: 16px;
  }

  @keyframes rise{
    to{ opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes draw{
    to{ stroke-dashoffset: 0; }
  }

  @media (prefers-reduced-motion: reduce){
    .card{ animation: none; opacity: 1; transform: none; }
    .check-path{ animation: none; stroke-dashoffset: 0; }
  }

  @media (max-width: 480px){
    .card{ padding: 44px 28px 36px; }
    h1{ font-size: 21px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="icon-ring">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path class="check-path" d="M5 13L9.5 17.5L19 7" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <h1>Form Submitted Successfully</h1>
  <p class="lead">Thank you for contacting us. We've received your details and will get back to you soon.</p>

  <a class="go-back" href="/">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M19 12H5M5 12L11 6M5 12L11 18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Go Back
  </a>
</div>

</body>
</html>
